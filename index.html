<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <!-- 移动端横屏锁定 -->
  <meta name="screen-orientation" content="landscape" />
  <meta name="orientation" content="landscape" />
  <title>MapStory - 横版冒险</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; }
    #game-container { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
    canvas { display: block; image-rendering: pixelated; max-width: 100%; max-height: 100%; }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <script type="module" src="/src/main.ts"></script>
  <script>
    // 检测移动端并尝试锁定横屏，竖屏时自动旋转
    function setupLandscape() {
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(() => {});
      }
      if (window.matchMedia('(orientation: portrait)').matches) {
        document.body.style.transform = 'rotate(90deg)';
        document.body.style.transformOrigin = 'center center';
      }
    }
    window.addEventListener('load', setupLandscape);
    window.matchMedia('(orientation: portrait)').addEventListener('change', setupLandscape);
  </script>
</body>
</html>
