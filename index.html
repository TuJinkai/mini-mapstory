<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <!-- 移动端横屏锁定 -->
  <meta name="screen-orientation" content="landscape" />
  <meta name="orientation" content="landscape" />
  <title>MapStory - 横版冒险</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; }
    #game-container { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
    canvas { display: block; image-rendering: pixelated; }

    /* 横屏提示（竖屏时显示） */
    @media screen and (orientation: portrait) {
      #rotate-hint {
        display: flex !important;
      }
    }
    #rotate-hint {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #1a1a2e;
      color: #ffffff;
      font-size: 18px;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 9999;
    }
    #rotate-hint .icon { font-size: 48px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div id="rotate-hint">
    <div class="icon">📱 ↻</div>
    <div>请将手机横屏使用</div>
  </div>
  <div id="game-container"></div>
  <script type="module" src="/src/main.ts"></script>
  <script>
    // 检测移动端并尝试锁定横屏
    if (/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
      // 尝试锁定屏幕方向
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(() => {});
      }
      // 监听屏幕方向变化
      screen.orientation?.addEventListener('change', () => {
        if (screen.orientation.type.startsWith('portrait')) {
          document.getElementById('rotate-hint').style.display = 'flex';
        } else {
          document.getElementById('rotate-hint').style.display = 'none';
        }
      });
    }
  </script>
</body>
</html>
